name: Build and Test

on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'release'

jobs:
  build:
    runs-on: [ubuntu-latest]
    steps:
      - name: Set Time Zone
        uses: szenius/set-timezone@v1.0
        with:
          timezoneLinux: "US/Pacific"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install NPM packages
        run: npm install
      - name: Install Clojure Tools
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: 1.12.5.1664
      - name: Resolve dependencies
        run: clojure -M:dev -m cljs.main --install-deps
      - name: Resolve test dependencies
        run: clojure -A:dev:test -P
      - name: Test
        run: clojure -M:poly test
      - name: Check
        run: clojure -M:poly check
